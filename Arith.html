<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition of two numbers</title>
</head>
<body>
   <script>
    let a=10;
    let b=20;
    let sum=a+b;
    console.log("sum=",sum);
    let sub=a-b;
    console.log("sub=",sub);
    let mul=a*b;
    console.log("mul=",mul);
    let Div=a/b;
    console.log("Div=",Div);
    let mod=a%b;
    console.log("mod=",mod);
   </script> 
</body>
</html>
